[project]
name = "cadsmith"
version = "0.2.0"
description = "Parametric CAD + mechanism analysis framework (kinematics, clearances, mass properties, animation)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "build123d>=0.9",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
parts = [
    "bd-warehouse",
]

[project.scripts]
mech = "mech.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
